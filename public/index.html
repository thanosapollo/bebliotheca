<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Thanos Apollo">
    <title>Βιβλιοθήκη</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="themes/src/index_theme/css/index.css">
    <script>document.documentElement.classList.add('js');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <span class="theme-toggle-icon">☀️</span>
        </button>
        <h1 class="title">Βιβλιοθήκη</h1>
        <div class="subtitle">Library of Constantinople</div>
        <div class="motto">Preserving the wisdom of antiquity</div>
    </div>

    <div class="intro">
      <p class="dev-notice">
        <a href="https://www.gnu.org/philosophy/"> Free</a> &amp; Open Source Project |
	<a href="https://git.thanosapollo.org/bebliotheca">Upstream</a>
      </p>
    </div>

    <div class="container">
        <div class="search-container">
            <label class="visually-hidden" for="search-box">Search catalog</label>
            <input type="search" id="search-box" name="q" placeholder="Search by title, author, #tag, or lang:..." autocomplete="off" aria-label="Search catalog">
            <button class="search-clear" id="search-clear" aria-label="Clear search" type="button">&times;</button>
            <ul class="search-dropdown" id="search-dropdown" role="listbox" aria-label="Search suggestions"></ul>
        </div>

        <div class="filter-buttons" role="radiogroup" aria-label="Availability filter">
            <button type="button" class="filter-btn active" role="radio" aria-checked="true" data-filter="all">All Works</button>
            <button type="button" class="filter-btn" role="radio" aria-checked="false" data-filter="translated">With English</button>
            <button type="button" class="filter-btn" role="radio" aria-checked="false" data-filter="untranslated">Without English</button>
        </div>

        <div class="stats" id="stats">
            <span id="stats-text">Loading...</span>
        </div>

        <div class="loading" id="loading" role="status">Loading the archives...</div>

        <noscript>
            <div class="fallback-notice" role="status">
                <p>The interactive catalog needs JavaScript. With scripts disabled, browse the raw catalog or the source tree instead.</p>
                <p>
                    <a href="catalog.json">catalog.json</a>
                    ·
                    <a href="https://git.thanosapollo.org/bebliotheca">Upstream source</a>
                </p>
            </div>
        </noscript>

        <ul class="works-list" id="works-container"></ul>

        <div class="footer">
            <span id="copyright"></span>
        </div>
    </div>
    <script src="themes/src/index_theme/js/index.js"></script>
</body>
</html>
