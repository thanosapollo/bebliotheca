<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Thanos Apollo">
    <title>Βιβλιοθήκη</title>
    <link rel="stylesheet" href="themes/src/index_theme/css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <span class="theme-toggle-icon">☀️</span>
        </button>
        <h1 class="title">Βιβλιοθήκη</h1>
        <div class="subtitle">Library of Constantinople</div>
        <div class="motto">Preserving the wisdom of antiquity</div>
    </div>

    <div class="intro">
      <blockquote class="dev-notice">

        <a href="https://www.gnu.org/philosophy/"> Free</a> & Open Source Project |
	<a href="https://git.thanosapollo.org/bebliotheca">Upstream</a> |
	<a href="https://codeberg.org/bebliotheca/bebliotheca">Codeberg Mirror</a>
        </blockquote>
    </div>

    <div class="container">
        <div class="search-container">
            <input type="text" id="search-box" placeholder="Search by title, author, #tag, or lang:..." autocomplete="off">
            <button class="search-clear" id="search-clear" aria-label="Clear search">&times;</button>
            <ul class="search-dropdown" id="search-dropdown"></ul>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All Works</button>
            <button class="filter-btn" data-filter="translated">With English</button>
            <button class="filter-btn" data-filter="untranslated">Greek/Latin Only</button>
        </div>

        <div class="stats" id="stats">
            <span id="stats-text">Loading...</span>
        </div>

        <div class="loading" id="loading">Loading the archives...</div>

        <ul class="works-list" id="works-container"></ul>

        <div class="footer">
            <span id="copyright"></span>
        </div>
    </div>
    <script src="themes/src/index_theme/js/index.js"></script>
</body>
</html>
